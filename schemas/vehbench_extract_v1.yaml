schema_version: "vehbench_extract_v1"
schema_name: "vehbench_record"
description: >
  VEHBench-focused extraction schema. The LLM only extracts benchmark-relevant
  physics fields. Paper metadata is copied by the pipeline from normalized_docs
  and must not be generated by the model.

type: object
properties:
  configuration:
    type: string
    required: true
    enum:
      - cantilever
      - diaphragm
      - plate
      - stack
      - rotary
      - frame
      - array
      - other
    description: >
      Dominant harvester structure. Use cantilever whenever the device is a
      cantilever beam or beam-with-tip-mass design.

  proof_mass:
    type: boolean
    required: true
    nullable: true
    description: >
      True if a proof/tip/sliding/mobile mass is explicitly used, false if
      explicitly absent, null if unclear.

  geometry:
    type: object
    required: true
    properties:
      length_mm:
        type: number
        unit: "mm"
      width_mm:
        type: number
        unit: "mm"
      thickness_mm:
        type: number
        unit: "mm"
      substrate_thickness_um:
        type: number
        unit: "um"
      piezo_thickness_um:
        type: number
        unit: "um"
      tip_mass_g:
        type: number
        unit: "g"
      diameter_mm:
        type: number
        unit: "mm"

  excitation:
    type: object
    required: true
    properties:
      type:
        type: string
        required: true
        enum:
          - vibration
          - impact
          - rotation
          - wind_induced
          - human_motion
          - other
      frequency_Hz:
        type: number
        unit: "Hz"
      acceleration_g:
        type: number
        unit: "g"
      displacement_mm:
        type: number
        unit: "mm"
      motion_source:
        type: string

  load:
    type: object
    required: true
    properties:
      load_resistance_ohm:
        type: number
        unit: "ohm"

  output:
    type: object
    required: true
    properties:
      resonant_frequency_Hz:
        type: number
        unit: "Hz"
      output_power_W:
        type: number
        unit: "W"
      open_circuit_voltage_V:
        type: number
        unit: "V"
      short_circuit_current_A:
        type: number
        unit: "A"
      bandwidth_Hz:
        type: number
        unit: "Hz"

  evidence:
    type: object
    required: true
    properties:
      configuration:
        type: object
        nullable: true
        properties:
          quote:
            type: string
          section:
            type: string
          source_type:
            type: string
            enum:
              - section
              - table
              - figure_caption
              - abstract
              - title
              - unknown

      proof_mass:
        type: object
        nullable: true
        properties:
          quote:
            type: string
          section:
            type: string
          source_type:
            type: string
            enum:
              - section
              - table
              - figure_caption
              - abstract
              - title
              - unknown

      geometry:
        type: object
        properties:
          length_mm:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          width_mm:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          thickness_mm:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          substrate_thickness_um:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          piezo_thickness_um:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          tip_mass_g:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          diameter_mm:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string

      excitation:
        type: object
        properties:
          type:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          frequency_Hz:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          acceleration_g:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          displacement_mm:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          motion_source:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string

      load:
        type: object
        properties:
          load_resistance_ohm:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string

      output:
        type: object
        properties:
          resonant_frequency_Hz:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          output_power_W:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          open_circuit_voltage_V:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          short_circuit_current_A:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
          bandwidth_Hz:
            type: object
            nullable: true
            properties:
              quote:
                type: string
              section:
                type: string
              source_type:
                type: string
